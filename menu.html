<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Cafe Menu</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f8f4f0;
        color: #333;
      }
      h1 {
        text-align: center;
      }
      .menu {
        max-width: 400px;
        margin: 0 auto;
      }
      .item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #ccc;
      }
      .item:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <h1>Café Menu</h1>
    <div class="menu">
      <div class="item">
        <span>Espresso</span>
        <span id="espresso-price">$0.01</span>
      </div>
      <div class="item">
        <span>Latte</span>
        <span>$3.50</span>
      </div>
      <div class="item">
        <span>Cappuccino</span>
        <span>$3.00</span>
      </div>
      <div class="item">
        <span>Mocha</span>
        <span>$3.75</span>
      </div>
      <div class="item">
        <span>Tea</span>
        <span>$2.00</span>
      </div>
    </div>
  </body>
</html>
